# LoRA SFT config for the Clojure code-flow LoRA (LLaMA-Factory).
#
# Refines the Phase-4 preset (bead qp8.2/qp8.3) against the assembled dataset
# (two objectives: git transitions and REPL workflow traces) and the
# overfitting findings from the text-style-transfer training docs.
#
# Environment (Qwen3.8-27B is the qwen3_5 architecture: VL wrapper, GatedDeltaNet
# linear attention on 3 of every 4 layers, MTP head):
#   - LLaMA-Factory from git main: the qwen3_8 template (PR #10749) isn't in
#     0.9.5. main pins transformers <=5.8.0 (!=5.6.0) and peft <=0.18.1;
#     qwen3_5 first ships in transformers 5.2.0. Verified with transformers
#     5.8.0 + peft 0.18.1 by tests/unit/test_training_parity.py.
#   - qwen3_8 adds Qwen's reasoning-effort line to the system prompt
#     (reasoning_effort, default xhigh, as Qwen's template) and keeps every
#     turn's <think> (preserve_thinking), so each eval step's reasoning is
#     trained.
#   - flash-linear-attention and causal-conv1d: without them transformers
#     falls back to the torch GatedDeltaNet path, which is far slower and
#     needs much more memory.
#
# Deviations from the original preset, with reasoning, are noted inline.
# Run:  llamafactory-cli train configs/codeflow_lora_qwen.yaml

### model
model_name_or_path: Qwen/Qwen3.8-27B
# No trust_remote_code: qwen3_5 is native in transformers. transformers drops
# the mtp.* weights on load (they're re-attached at export, bead 0sv.18).

### method
stage: sft
do_train: true
finetuning_type: lora
# all = every Linear outside the vision tower and projector (both frozen by
# LLaMA-Factory's freeze_vision_tower / freeze_multi_modal_projector defaults):
# q/k/v/o and MLP projections, plus GatedDeltaNet's in_proj_qkv/z/a/b and
# out_proj. Needed to carry both objectives.
lora_target: all

# Rank: 32, not the originally-planned 64. A ~2-3K example set gives rank 64
# well under the 18-ex/rank "minimum viable" the style study found for the
# smaller workflow objective. If output comes back verbatim, drop to 16; if it
# underfits the breadth of idioms, raise to 48.
lora_rank: 32
lora_alpha: 64                # alpha/rank = 2.0 effective scaling (standard)
use_rslora: false             # avoids the alpha/sqrt(rank) gradient-explosion
                              #   gotcha (alpha=rank+rsLoRA -> ~sqrt(rank)x -> NaN)
lora_dropout: 0.1             # prevents verbatim memorization at this rank

# Embedding noise — forces generalized patterns over memorized phrasing.
neftune_noise_alpha: 5.0

### dataset
dataset: codeflow_train       # registered in data/dataset_info.json (below)
eval_dataset: codeflow_val    # our own held-out split (grouped by repo, leakage-checked)
template: qwen3_8
# Thinking mode stays on, and is set explicitly because it changes what is
# trained: a response with no <think> block gets an EMPTY one prepended and
# included in the loss, teaching the model to skip reasoning. Every assistant
# turn needs a real <think>...</think> (bead 0sv.19). Serve with thinking on too.
enable_thinking: true
disable_shuffling: true       # train file is in curriculum order (easy -> hard,
                              #   assembly/curriculum.py); keep it
train_on_prompt: false        # loss on the completion only, not the prompt (default,
                              #   but pinned explicitly — critical for SFT quality)
cutoff_len: 16384             # the assembler drops anything longer, measured with
                              #   this model's tokenizer on the rendered template
                              #   (clj-lora-assemble --cutoff-len), so nothing is
                              #   truncated mid-diff here.
# No packing. LLaMA-Factory resets GatedDeltaNet state at packed-sequence
# boundaries only with flash_attn: fa2 on CUDA; otherwise recurrent state
# leaks from one example into the next. At batch size 1 packing buys only
# throughput. To pack, set neat_packing: true together with flash_attn: fa2.
neat_packing: false
preprocessing_num_workers: 8
overwrite_cache: true

### output
output_dir: outputs/codeflow-lora-qwen-r32
logging_steps: 5
save_steps: 50
plot_loss: true
report_to: tensorboard

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16   # effective batch 16 (x num_gpus)
learning_rate: 1.0e-4             # LLaMA-Factory LoRA default; ~10x the full-FT LR.
                                  #   Lower than the planned 3e-4 — safer on a 27B
                                  #   with limited data. Pair with cosine + warmup.
num_train_epochs: 3.0             # ceiling; early stopping below usually halts at 2-3
lr_scheduler_type: cosine
# Steps = ceil(train_records / 16) per epoch with packing off: ~163/epoch at
# 2.6K train records, ~490 for 3 epochs. Ratios and per-step settings below
# hold across dataset sizes; recheck if train drops under ~1K records.
warmup_ratio: 0.1                 # ~50 warmup steps at 2.6K records
weight_decay: 0.0                 # safe for short SFT (raise to 0.1 only if overfitting)
bf16: true                        # no quantization noise; bf16 LoRA = full-fidelity
                                  #   parity with full FT for SFT at this data scale
max_grad_norm: 1.0                # standard for a dense model
flash_attn: auto                  # sdpa on the full-attention layers; the linear-attention
                                  #   layers use the fla kernels regardless
gradient_checkpointing: true

### eval + early stopping
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 25                    # ~20 evals over a 3-epoch run at 2.6K records
                                  #   (save_steps must stay a multiple of this)
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
early_stopping_steps: 3           # stop after 3 evals without improvement
